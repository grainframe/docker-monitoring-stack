global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'instance']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'default'
      repeat_interval: 1h

receivers:
  - name: 'default'
    # ── Telegram ──────────────────────────────────────────────────────────────
    # Uncomment and fill to get alerts in Telegram.
    #
    # telegram_configs:
    #   - bot_token: 'YOUR_BOT_TOKEN'        # from @BotFather
    #     chat_id: YOUR_CHAT_ID              # numeric ID of your chat or group
    #     parse_mode: 'HTML'
    #     message: |
    #       <b>{{ .Status | toUpper }}</b> [{{ .CommonLabels.severity }}]
    #       <b>{{ .CommonAnnotations.summary }}</b>
    #       {{ .CommonAnnotations.description }}

    # ── Email ─────────────────────────────────────────────────────────────────
    # email_configs:
    #   - to: 'admin@example.com'
    #     from: 'alertmanager@example.com'
    #     smarthost: 'smtp.example.com:587'
    #     auth_username: 'alertmanager@example.com'
    #     auth_password: 'YOUR_PASSWORD'
    #     require_tls: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
