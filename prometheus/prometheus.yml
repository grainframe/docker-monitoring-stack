global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - '/etc/prometheus/rules/*.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    # To monitor additional hosts, add them below:
    # - targets: ['192.168.1.10:9100', '192.168.1.11:9100']

  # Uncomment to scrape a second server running node-exporter:
  # - job_name: 'remote-server'
  #   static_configs:
  #     - targets: ['YOUR_SERVER_IP:9100']
  #   labels:
  #     instance: 'web-01'
